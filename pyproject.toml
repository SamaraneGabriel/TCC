[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tcc-matching"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.27",
    "pymupdf>=1.24",
    "google-genai>=1.0",
    "qdrant-client>=1.9",
]

[project.optional-dependencies]
openai = ["openai>=1.30"]
ui = ["streamlit>=1.30"]
# Seção 6.3 do plano de avaliação. Precision@K/nDCG@K/Recall@K e o bootstrap são
# implementados à mão (exigência do plano); daqui vêm só kappa e Wilcoxon.
eval = [
    "pandas>=2.0",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "scipy>=1.11",
]
dev = [
    "pytest>=8.0",
    "python-dotenv>=1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires real API keys (deselect with -m 'not integration')"]
